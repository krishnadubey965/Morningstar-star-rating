name: Monthly Data Refresh

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install pandas numpy requests

      - name: Run pipeline
        run: |
          python src/fetch_nav.py
          python src/calculate_returns.py
          python src/compute_mrar.py
          python src/star_rating.py
          python src/database.py

      - name: Commit updated data
        run: |
          git config --global user.email "krishnadubey2602@gmail.com"
          git config --global user.name "krishnadubey965"
          git add data/
          git diff --staged --quiet || git commit -m "Auto refresh: $(date)"
          git push